---
- name: Zabbix Repo
  get_url:
    url: https://repo.zabbix.com/zabbix/7.2/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.2+ubuntu24.04_all.deb
    dest: /tmp/zabbix-release.deb
    mode: '0644'
  tags: [installation, zabbix]

- name: Install Zabbix
  apt:
    deb: /tmp/zabbix-release.deb
    state: present
  tags: [installation, zabbix]

- name: Update repositories cache and install required packages
  ansible.builtin.apt:
    pkg: "{{ install_packages }}"
    update_cache: yes
  tags: [installation, packages]

- name: Update and upgrade all packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
  tags: [installation, upgrade]

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  tags: [installation, reboot]

- name: Reboot if required
  ansible.builtin.reboot:
    msg: "Rebooting after upgrade"
    pre_reboot_delay: 5
    post_reboot_delay: 10
    reboot_timeout: 600
  when: reboot_required_file.stat.exists
  notify: Hey Handler! PLZ Bring UP the Wireguard Tunnel.
  tags: [installation, reboot]
