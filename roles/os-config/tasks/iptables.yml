---
- name: Ensure iptables-persistent directory exists
  ansible.builtin.file:
    path: /etc/iptables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Preseed iptables-persistent autosave
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: boolean
  loop:
    - question: iptables-persistent/autosave_v4
      value: "true"
    - question: iptables-persistent/autosave_v6
      value: "true"

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Deploy iptables rules file
  ansible.builtin.template:
    src: iptables/rules.v4.j2
    dest: /etc/iptables/rules.v4
    owner: root
    group: root
    mode: "0640"
  register: iptables_rules

- name: Apply iptables rules atomically
  ansible.builtin.command:
    argv:
      - iptables-restore
      - /etc/iptables/rules.v4
  register: iptables_restore
  changed_when: iptables_rules is changed
