---
- name: Ensure iptables-persistent directory exists
  ansible.builtin.file:
    path: /etc/iptables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Preseed iptables-persistent autosave
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: boolean
  loop:
    - question: iptables-persistent/autosave_v4
      value: "true"
    - question: iptables-persistent/autosave_v6
      value: "true"

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Apply INPUT firewall rules (preserve Docker FORWARD/OUTPUT)
  ansible.builtin.shell: |
    set -euo pipefail
    iptables -F INPUT
    iptables -A INPUT -i lo -j ACCEPT
    iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    iptables -A INPUT -p tcp --dport {{ ssh_port }} -j ACCEPT
    iptables -A INPUT -p udp --dport {{ wg_interface_listen_port }} -j ACCEPT
    {% if zabbix_server_ip is defined %}
    iptables -A INPUT -p tcp -s {{ zabbix_server_ip }}/32 --dport 10050 -j ACCEPT
    {% endif %}
    iptables -P INPUT DROP
    iptables-save > /etc/iptables/rules.v4
  args:
    executable: /bin/bash
  register: iptables_apply
  changed_when: true
