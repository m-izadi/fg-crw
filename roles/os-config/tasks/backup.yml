---
- name: Create backup directory with timestamp
  ansible.builtin.shell: |
    timestamp=$(date +"%Y-%m-%d_%H-%M-%S")
    mkdir -p {{ backup_base_dir }}/${timestamp}
    echo ${timestamp}
  register: backup_timestamp
  changed_when: false

