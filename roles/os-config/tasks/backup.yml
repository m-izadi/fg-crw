- name: Copy existing config files to backup folder
  ansible.builtin.shell: |
    for f in {{ backup_files | join(' ') }}; do
      if [ -f "$f" ]; then
        cp -r "$f" {{ backup_base_dir }}/{{ backup_timestamp.stdout }}/
      fi
    done

- name: Keep only the latest {{ max_backups }} backups
  ansible.builtin.shell: |
    cd {{ backup_base_dir }}
    ls -1dt */ | tail -n +{{ max_backups + 1 }} | xargs -r rm -rf
  changed_when: false
