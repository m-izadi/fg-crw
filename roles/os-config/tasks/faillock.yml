---
- name: Get failed login attempts for all users
  # become: yes
  shell: |
    for user in $(cut -d: -f1 /etc/passwd); do
      faillock --user $user | grep 'fail' | sed "s/^/$user: /"
    done
  register: faillock_output
  changed_when: false
  tags: pam
  notify: Hey Handler! PLZ Reset faillock users

- name: Show failed login summary
  debug:
    var: faillock_output.stdout_lines
  tags: pam

