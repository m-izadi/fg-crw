# Local / manual use: copy .env.example to .env and set BIND_ADDRESS.
# Production deploy is managed by Ansible (roles/app).

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/2181'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  session-manager:
    build: ./session_manager
    container_name: session-manager
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:?set BIND_ADDRESS in .env}:8001:8001"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',8001),5); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build: ./api
    container_name: api
    restart: unless-stopped
    depends_on:
      session-manager:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:?set BIND_ADDRESS in .env}:8000:8000"
    environment:
      SESSION_MANAGER_URL: http://session-manager:8001
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  backend:
    driver: bridge
