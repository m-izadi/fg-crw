version: '3.8'

services:

  # ---------- INFRA ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------- SERVICES ----------

  session-manager:
    build: ./session_manager
    container_name: session-manager
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=mongodb://172.17.0.1:27017   # 👈 مهم

  api:
    build: ./api
    container_name: api
    depends_on:
      - session-manager
    ports:
      - "8000:8000"
    environment:
      - SESSION_MANAGER_URL=http://session-manager:8001
